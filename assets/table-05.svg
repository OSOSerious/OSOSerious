<svg xmlns="http://www.w3.org/2000/svg" width="890" height="507" viewBox="0 0 890 507" role="img"><style>svg{filter:saturate(1.6) brightness(1.25);}</style><g id="bevel"><rect x="6" y="8" width="880" height="495" rx="12" fill="#2E1065" opacity=".9"/><rect x="3" y="4" width="880" height="495" rx="12" fill="#4C1D95" opacity=".55"/></g><rect width="880" height="495" rx="12" fill="#0E0A16"/><line x1="14" y1="2" x2="866" y2="2" stroke="#8B5CF6" stroke-opacity=".7" stroke-width="1.5"/><rect x="9" y="9" width="862" height="28" rx="7" fill="#4C1D95"/><text x="18" y="29" font-size="13" fill="#F3EDFF" font-weight="700">Provider</text><text x="164.96" y="29" font-size="13" fill="#F3EDFF" font-weight="700">Models &amp; Experience</text><rect x="9" y="41" width="862" height="64" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="61" font-size="13" fill="#E9D5FF" font-weight="700">▲ OpenAI</text><text x="164.96" y="61" font-size="13" fill="#A78BFA">GPT-5 (latest flagship), GPT-4o (multimodal), o3-pro and o4-mini (reasoning), OpenAI</text><text x="164.96" y="79" font-size="13" fill="#A78BFA">Agents SDK, Assistants API with retrieval and code interpreter, Codex, Embeddings API</text><text x="164.96" y="97" font-size="13" fill="#A78BFA">(text-embedding-3-large), Whisper, DALL-E 3.</text><line x1="155.96" y1="45" x2="155.96" y2="101" stroke="#2E1065"/><rect x="9" y="109" width="862" height="46" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="129" font-size="13" fill="#E9D5FF" font-weight="700">▲ Anthropic</text><text x="164.96" y="129" font-size="13" fill="#A78BFA">Claude 4.5 (Opus/Sonnet), extended thinking, tool use, prompt caching (90% cost ↓), batch</text><text x="164.96" y="147" font-size="13" fill="#A78BFA">processing, MCP server development.</text><line x1="155.96" y1="113" x2="155.96" y2="151" stroke="#2E1065"/><rect x="9" y="159" width="862" height="46" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="179" font-size="13" fill="#E9D5FF" font-weight="700">▲ Google</text><text x="164.96" y="179" font-size="13" fill="#A78BFA">Gemini 2.5 Pro/Flash, Vertex AI Agent Engine, AI Studio, grounding with Google Search,</text><text x="164.96" y="197" font-size="13" fill="#A78BFA">Gemini Code Assist.</text><line x1="155.96" y1="163" x2="155.96" y2="201" stroke="#2E1065"/><rect x="9" y="209" width="862" height="46" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="229" font-size="13" fill="#E9D5FF" font-weight="700">▲ DeepSeek</text><text x="164.96" y="229" font-size="13" fill="#A78BFA">DeepSeek-V3.1 (671B parameters, MoE architecture), DeepSeek-R1 reasoning model (MIT</text><text x="164.96" y="247" font-size="13" fill="#A78BFA">license), R1-Distill variants for efficient deployment, open-weight with commercial use.</text><line x1="155.96" y1="213" x2="155.96" y2="251" stroke="#2E1065"/><rect x="9" y="259" width="862" height="46" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="279" font-size="13" fill="#E9D5FF" font-weight="700">▲ Alibaba (Qwen)</text><text x="164.96" y="279" font-size="13" fill="#A78BFA">Qwen 3 (235B MoE, flagship), Qwen 2.5 Coder 32B (code-specialized), Qwen-Math, Qwen-VL,</text><text x="164.96" y="297" font-size="13" fill="#A78BFA">open-weight Apache 2.0 license.</text><line x1="155.96" y1="263" x2="155.96" y2="301" stroke="#2E1065"/><rect x="9" y="309" width="862" height="64" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="329" font-size="13" fill="#E9D5FF" font-weight="700">▲ Zhipu (GLM)</text><text x="164.96" y="329" font-size="13" fill="#A78BFA">GLM-5.x family for agentic coding — provider routing between flash and full tiers,</text><text x="164.96" y="347" font-size="13" fill="#A78BFA">OpenAI/Anthropic-compatible endpoint integration, cost/performance tuning for daily agent</text><text x="164.96" y="365" font-size="13" fill="#A78BFA">workloads.</text><line x1="155.96" y1="313" x2="155.96" y2="369" stroke="#2E1065"/><rect x="9" y="377" width="862" height="46" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="397" font-size="13" fill="#E9D5FF" font-weight="700">▲ Groq</text><text x="164.96" y="397" font-size="13" fill="#A78BFA">LPU (Language Processing Unit) accelerated inference, ultra-fast token generation, Llama</text><text x="164.96" y="415" font-size="13" fill="#A78BFA">and Mixtral hosting, production API with consistent low latency.</text><line x1="155.96" y1="381" x2="155.96" y2="419" stroke="#2E1065"/><rect x="9" y="427" width="862" height="64" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="447" font-size="13" fill="#E9D5FF" font-weight="700">▲ Self-Hosted</text><text x="164.96" y="447" font-size="13" fill="#A78BFA">Ollama (local LLM deployment), vLLM (high-throughput serving, prefix-cache economics),</text><text x="164.96" y="465" font-size="13" fill="#A78BFA">LiteLLM (unified API with cost tracking), NVIDIA Triton Inference Server, Text Generation</text><text x="164.96" y="483" font-size="13" fill="#A78BFA">Inference (TGI), llama.cpp (CPU/GPU inference).</text><line x1="155.96" y1="431" x2="155.96" y2="487" stroke="#2E1065"/><g id="chip05"><rect x="703" y="461" width="163" height="24" rx="12" fill="#4C1D95" stroke="#A78BFA" stroke-opacity=".7"/><circle cx="717" cy="473" r="4" fill="#E9D5FF"/><text x="729" y="477" font-size="11.5" font-weight="700" font-family="Courier New,monospace" fill="#F3EDFF" letter-spacing="1">MODELS &amp; PROVIDERS</text></g></svg>