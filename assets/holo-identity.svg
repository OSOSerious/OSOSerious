<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" class="mono"><style>@keyframes palflip { 0%,42%{transform:rotate(0)} 50%,92%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }
@keyframes glowpulse { 0%,100%{filter:drop-shadow(0 0 4px #6D28D9)} 50%{filter:drop-shadow(0 0 18px #8B5CF6)} }
@keyframes blink { 0%,92%{opacity:1} 94%,100%{opacity:0} }
@keyframes typeline { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
@keyframes holoFlick { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.4} 94%{opacity:1} 96%{opacity:.7} 97%{opacity:1} }
@keyframes holoShift { 0%,100%{transform:translateX(0)} 49%{transform:translateX(0)} 50%{transform:translateX(-2px)} 51%{transform:translateX(1px)} }
@keyframes ripple { 0%{transform:scale(.6);opacity:.9} 100%{transform:scale(2.6);opacity:0} }
@keyframes sweepX { from{transform:translateX(-120%)} to{transform:translateX(320%)} }</style>
        <defs>
          <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <!-- plinth -->
        <ellipse cx="260" cy="216" rx="130" ry="22" fill="#241A38" stroke="#4C1D95" stroke-width="2"/>
        <rect x="180" y="196" width="160" height="22" rx="6" fill="#17121F" stroke="#6D28D9"/>
        <circle cx="260" cy="207" r="5" fill="#E9D5FF"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
        <!-- projection cone -->
        <polygon points="240,196 280,196 400,40 120,40" fill="url(#beam)">
          <animate attributeName="opacity" values=".7;1;.7" dur="3s" repeatCount="indefinite"/>
        </polygon>
        <!-- hologram mark -->
        <g style="animation: holoFlick 4s linear infinite, holoShift 4s linear infinite">
          <text x="260" y="130" text-anchor="middle" font-size="64" font-weight="900" fill="#E9D5FF" letter-spacing="8"
                style="filter:drop-shadow(0 0 16px #8B5CF6)">OSO</text>
          <!-- chromatic edges -->
          <text x="257" y="130" text-anchor="middle" font-size="64" font-weight="900" fill="#6D28D9" letter-spacing="8" opacity=".6">OSO</text>
          <text x="263" y="130" text-anchor="middle" font-size="64" font-weight="900" fill="#A78BFA" letter-spacing="8" opacity=".5">OSO</text>
          <!-- scanlines -->
          <g stroke="#17121F" stroke-width="3" opacity=".5">
            <line x1="185" y1="84" x2="335" y2="84"/><line x1="180" y1="98" x2="340" y2="98"/>
            <line x1="178" y1="112" x2="342" y2="112"/><line x1="180" y1="126" x2="340" y2="126"/>
            <line x1="184" y1="140" x2="336" y2="140"/>
          </g>
        </g>
        <!-- dust motes -->
        <g fill="#C4B5FD">
          <circle cx="200" cy="160" r="2"><animate attributeName="cy" values="160;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="5s" repeatCount="indefinite"/></circle>
          <circle cx="320" cy="170" r="1.6"><animate attributeName="cy" values="170;50" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
          <circle cx="270" cy="150" r="1.8"><animate attributeName="cy" values="150;45" dur="5.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="5.5s" begin="4s" repeatCount="indefinite"/></circle>
        </g>
        <text x="392" y="222" font-size="10" fill="#6D28D9">PRJ · v5</text>
        <text x="30" y="34" font-size="11" fill="#8B5CF6">// identity projected</text>
      </svg>