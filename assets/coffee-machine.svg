<svg width="500" height="250" viewBox="0 0 500 250" class="mono"><style></style>
        <!-- machine body -->
        <rect x="120" y="20" width="260" height="130" rx="14" fill="#17121F" stroke="#8B5CF6" stroke-width="3"/>
        <rect x="136" y="34" width="90" height="40" rx="6" fill="#0B0716" stroke="#4C1D95"/>
        <text x="181" y="60" text-anchor="middle" font-size="13" fill="#A78BFA">OSO ESPRESSO</text>
        <!-- gauge -->
        <circle cx="340" cy="56" r="20" fill="#0B0716" stroke="#4C1D95" stroke-width="3"/>
        <line x1="340" y1="56" x2="340" y2="42" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="0 340 56;140 340 56;0 340 56" keyTimes="0;.4;.9" dur="4s" repeatCount="indefinite"/>
        </line>
        <text x="340" y="59" text-anchor="middle" font-size="8" fill="#9D8AB8">bar</text>
        <!-- Signal lamp -->
        <circle cx="244" cy="54" r="8" fill="#E85D26">
          <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <!-- portafilter -->
        <g transform="translate(250,150)">
          <rect x="-40" y="-14" width="80" height="16" rx="6" fill="#4C1D95" stroke="#A78BFA"/>
          <rect x="-6" y="2" width="12" height="14" fill="#6D28D9"/>
          <!-- stream -->
          <rect x="-3" y="16" width="6" height="0" rx="3" fill="#5B21B6">
            <animate attributeName="height" values="0;46;46;0" keyTimes="0;.25;.75;1" dur="4s" repeatCount="indefinite"/>
          </rect>
          <line x1="-58" y1="-6" x2="-42" y2="-6" stroke="#A78BFA" stroke-width="7" stroke-linecap="round"/>
        </g>
        <!-- cup -->
        <g transform="translate(250,196)">
          <path d="M-26 0 L26 0 L20 30 L-20 30 Z" fill="#0B0716" stroke="#C4B5FD" stroke-width="2"/>
          <path d="M26 4 q16 4 12 16 q-4 10 -14 8" fill="none" stroke="#C4B5FD" stroke-width="3"/>
          <!-- fill -->
          <rect x="-21" y="6" width="42" height="22" rx="3" fill="#3B1580">
            <animate attributeName="height" values="0;22;22;0" keyTimes="0;.3;.8;1" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="y" values="28;6;6;28" keyTimes="0;.3;.8;1" dur="4s" repeatCount="indefinite"/>
          </rect>
          <text x="0" y="24" text-anchor="middle" font-size="9" fill="#C4B5FD">main</text>
        </g>
        <!-- steam -->
        <g fill="none" stroke="#9D8AB8" stroke-width="2" opacity=".7">
          <path d="M236 186 q-6 -10 0 -18 q6 -8 0 -16">
            <animate attributeName="opacity" values="0;.8;0" dur="2.2s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="translate" values="0 6;0 -10" dur="2.2s" repeatCount="indefinite"/>
          </path>
          <path d="M264 186 q6 -10 0 -18 q-6 -8 0 -16">
            <animate attributeName="opacity" values="0;.7;0" dur="2.6s" begin=".8s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="translate" values="0 6;0 -12" dur="2.6s" begin=".8s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- counter -->
        <g transform="translate(398,140)">
          <rect width="88" height="66" rx="8" fill="#17121F" stroke="#4C1D95"/>
          <text x="12" y="24" font-size="10" fill="#9D8AB8">shots today</text>
          <text x="12" y="52" font-size="24" font-weight="900" fill="#E9D5FF">
            <animate attributeName="textContent" values="3;4;5;6" dur="4s" calcMode="discrete" repeatCount="indefinite"/>
          </text>
        </g>
        <text x="30" y="240" font-size="11" fill="#6D28D9">// pulls per deploy: 1</text>
      </svg>