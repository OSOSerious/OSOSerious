<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" font-family="Courier New,monospace"><style>svg{filter:saturate(1.7) brightness(1.3) contrast(1.1);}@keyframes palflip { 0%,42%{transform:rotate(0)} 50%,92%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }
@keyframes glowpulse { 0%,100%{filter:drop-shadow(0 0 4px #6D28D9)} 50%{filter:drop-shadow(0 0 18px #8B5CF6)} }
@keyframes blink { 0%,92%{opacity:1} 94%,100%{opacity:0} }
@keyframes typeline { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
@keyframes sweepX { from{transform:translateX(-120%)} to{transform:translateX(320%)} }
@keyframes swim { 0%{transform:translateX(-14%) rotate(-3deg)} 50%{transform:translateX(14%) rotate(3deg)} 100%{transform:translateX(-14%) rotate(-3deg)} }
@keyframes tailflick { 0%,100%{transform:skewX(0)} 50%{transform:skewX(14deg)} }
@keyframes ripple { 0%{transform:scale(.6);opacity:.9} 100%{transform:scale(2.4);opacity:0} }</style>
        <g style="transform-origin:260px 118px; animation: palflip 14s cubic-bezier(.6,0,.4,1) infinite">
          <!-- left half blot -->
          <g fill="#4C1D95">
            <rect x="150" y="60" width="26" height="26" rx="6"/><rect x="122" y="76" width="26" height="26" rx="6" fill="#5B21B6"/>
            <rect x="98" y="96" width="24" height="24" rx="6" fill="#6D28D9"/><rect x="130" y="108" width="30" height="30" rx="8" fill="#8B5CF6"/>
            <rect x="150" y="140" width="26" height="26" rx="6" fill="#5B21B6"/><rect x="118" y="150" width="24" height="24" rx="6"/>
            <rect x="92" y="130" width="20" height="20" rx="5" fill="#3B1580"/><rect x="164" y="88" width="18" height="18" rx="5" fill="#A78BFA"/>
            <rect x="170" y="126" width="16" height="16" rx="4" fill="#C4B5FD"/>
          </g>
          <!-- right half = mirror -->
          <g fill="#4C1D95" transform="translate(520,0) scale(-1,1)">
            <rect x="150" y="60" width="26" height="26" rx="6"/><rect x="122" y="76" width="26" height="26" rx="6" fill="#5B21B6"/>
            <rect x="98" y="96" width="24" height="24" rx="6" fill="#6D28D9"/><rect x="130" y="108" width="30" height="30" rx="8" fill="#8B5CF6"/>
            <rect x="150" y="140" width="26" height="26" rx="6" fill="#5B21B6"/><rect x="118" y="150" width="24" height="24" rx="6"/>
            <rect x="92" y="130" width="20" height="20" rx="5" fill="#3B1580"/><rect x="164" y="88" width="18" height="18" rx="5" fill="#A78BFA"/>
            <rect x="170" y="126" width="16" height="16" rx="4" fill="#C4B5FD"/>
          </g>
          <!-- axis -->
          <line x1="260" y1="24" x2="260" y2="212" stroke="#8B5CF6" stroke-dasharray="3 6" opacity=".6"/>
        </g>
        <text x="260" y="238" text-anchor="middle" class="hud" fill="#A78BFA">same. upside. down.</text>
        <text x="24" y="30" class="hud" fill="#6D28D9">inkblot v1</text>
      </svg>