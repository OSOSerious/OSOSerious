<svg xmlns="http://www.w3.org/2000/svg" width="890" height="245" viewBox="0 0 890 245" role="img"><style>svg{filter:saturate(1.6) brightness(1.25);}</style><g id="bevel"><rect x="6" y="8" width="880" height="233" rx="12" fill="#2E1065" opacity=".9"/><rect x="3" y="4" width="880" height="233" rx="12" fill="#4C1D95" opacity=".55"/></g><rect width="880" height="233" rx="12" fill="#0E0A16"/><line x1="14" y1="2" x2="866" y2="2" stroke="#8B5CF6" stroke-opacity=".7" stroke-width="1.5"/><rect x="9" y="9" width="862" height="28" rx="7" fill="#4C1D95"/><text x="18" y="29" font-size="13" fill="#F3EDFF" font-weight="700">Category</text><text x="156.9" y="29" font-size="13" fill="#F3EDFF" font-weight="700">Integrations</text><rect x="9" y="41" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="61" font-size="13" fill="#E9D5FF" font-weight="700">▣ Payments</text><text x="156.9" y="61" font-size="13" fill="#A78BFA">Stripe (subscriptions, webhooks, Connect, Checkout, Payment Intents)</text><line x1="147.9" y1="45" x2="147.9" y2="65" stroke="#2E1065"/><rect x="9" y="73" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="93" font-size="13" fill="#E9D5FF" font-weight="700">▣ Communication</text><text x="156.9" y="93" font-size="13" fill="#A78BFA">Slack API, Discord API, Twilio (SMS, Voice, WhatsApp), SendGrid, Mailgun</text><line x1="147.9" y1="77" x2="147.9" y2="97" stroke="#2E1065"/><rect x="9" y="105" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="125" font-size="13" fill="#E9D5FF" font-weight="700">▣ Google</text><text x="156.9" y="125" font-size="13" fill="#A78BFA">Calendar, Docs, Sheets, Gmail, Drive</text><line x1="147.9" y1="109" x2="147.9" y2="129" stroke="#2E1065"/><rect x="9" y="137" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="157" font-size="13" fill="#E9D5FF" font-weight="700">▣ Social</text><text x="156.9" y="157" font-size="13" fill="#A78BFA">Twitter/X API, Facebook Graph API, LinkedIn API</text><line x1="147.9" y1="141" x2="147.9" y2="161" stroke="#2E1065"/><rect x="9" y="169" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="189" font-size="13" fill="#E9D5FF" font-weight="700">▣ CRM</text><text x="156.9" y="189" font-size="13" fill="#A78BFA">HubSpot API, Salesforce API, Notion API, Airtable API</text><line x1="147.9" y1="173" x2="147.9" y2="193" stroke="#2E1065"/><rect x="9" y="201" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="221" font-size="13" fill="#E9D5FF" font-weight="700">▣ Developer</text><text x="156.9" y="221" font-size="13" fill="#A78BFA">GitHub API (repository automation, webhooks, Actions)</text><line x1="147.9" y1="205" x2="147.9" y2="225" stroke="#2E1065"/></svg>