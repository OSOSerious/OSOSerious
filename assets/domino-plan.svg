<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" class="mono"><style>svg{filter:saturate(1.7) brightness(1.3) contrast(1.1);}@keyframes palflip { 0%,42%{transform:rotate(0)} 50%,92%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }
@keyframes glowpulse { 0%,100%{filter:drop-shadow(0 0 4px #6D28D9)} 50%{filter:drop-shadow(0 0 18px #8B5CF6)} }
