<svg xmlns="http://www.w3.org/2000/svg" width="540" height="240" viewBox="0 0 540 240" class="mono"><style></style>
        <!-- maze walls -->
        <g stroke="#4C1D95" stroke-width="5" stroke-linecap="round" fill="none">
          <path d="M40 30 L40 60 M40 90 L40 150 M40 180 L40 210 L140 210"/>
          <path d="M140 30 L140 90 M140 120 L140 210"/>
          <path d="M140 90 L240 90 M240 30 L240 150"/>
          <path d="M240 180 L240 210 L340 210"/>
          <path d="M340 30 L340 60 M340 90 L340 180"/>
          <path d="M340 60 L440 60 M440 30 L440 120 M440 150 L440 210 L500 210"/>
          <path d="M40 30 L500 30"/>
          <path d="M500 30 L500 210"/>
          <path d="M40 210 L40 210 M500 210 L500 210"/>
        </g>
        <!-- start/goal -->
        <text x="52" y="52" font-size="11" fill="#A78BFA">IN</text>
        <rect x="466" y="176" width="30" height="30" rx="6" fill="#2E1065" stroke="#E9D5FF" stroke-width="2"/>
        <text x="481" y="196" text-anchor="middle" font-size="11" fill="#E9D5FF">★</text>
        <!-- explored trail (fades) -->
        <g fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" opacity=".55">
          <path d="M60 45 L120 45 L120 105 L60 105 L60 165">
            <animate attributeName="stroke-dashoffset" values="400;0" dur="4.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;.6;.6;0" keyTimes="0;.3;.85;1" dur="4.5s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- winning path lights up -->
        <path d="M60 45 L120 45 L120 105 L195 105 L195 45 L315 45 L315 105 L390 105 L390 165 L480 165 L480 190"
              fill="none" stroke="#E9D5FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="700" stroke-dashoffset="700">
          <animate attributeName="stroke-dashoffset" values="700;0;0;700" keyTimes="0;.6;.92;1" dur="6s" repeatCount="indefinite"/>
        </path>
        <!-- runner -->
        <circle r="8" fill="#E9D5FF" stroke="#8B5CF6" stroke-width="2">
          <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.6;1"
            path="M60 45 L120 45 L120 105 L195 105 L195 45 L315 45 L315 105 L390 105 L390 165 L480 165 L480 190"/>
        </circle>
        <!-- goal flash -->
        <rect x="466" y="176" width="30" height="30" rx="6" fill="none" stroke="#E9D5FF" stroke-width="3" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.58;.66;1" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="3;10;3" keyTimes="0;.6;.75" dur="6s" repeatCount="indefinite"/>
        </rect>
        <text x="44" y="232" font-size="11" fill="#6D28D9">wall-follow ▸ backtracking ▸ locked path</text>
      </svg>