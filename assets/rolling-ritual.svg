<svg width="480" height="180" viewBox="0 0 480 180" class="mono"><style>@keyframes palflip { 0%,42%{transform:rotate(0)} 50%,92%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }
@keyframes glowpulse { 0%,100%{filter:drop-shadow(0 0 4px #6D28D9)} 50%{filter:drop-shadow(0 0 18px #8B5CF6)} }
@keyframes blink { 0%,92%{opacity:1} 94%,100%{opacity:0} }
@keyframes typeline { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
@keyframes sweepX { from{transform:translateX(-120%)} to{transform:translateX(320%)} }
@keyframes dr { 0%{stroke-dashoffset:1400} 45%,80%{stroke-dashoffset:0} 100%{stroke-dashoffset:-1400} }
@keyframes stamp { 0%,55%{opacity:0} 65%,85%{opacity:1} 100%{opacity:0} }</style>
        <rect x="40" y="40" width="400" height="100" rx="14" fill="#0B0716" stroke="#4C1D95" stroke-width="2"/>
        <text x="64" y="76" font-size="15" fill="#9D8AB8">[<tspan fill="#E9D5FF" font-weight="700"><tspan id="n">4</tspan></tspan>] ████</text>
        <!-- pips -->
        <g>
          <circle cx="300" cy="70" r="12" fill="#2E1065" stroke="#6D28D9" stroke-width="2">
            <animate attributeName="fill" values="#2E1065;#8B5CF6;#2E1065" dur="4s" begin="0s" repeatCount="indefinite"/>
          </circle>
          <circle cx="336" cy="70" r="12" fill="#2E1065" stroke="#6D28D9" stroke-width="2">
            <animate attributeName="fill" values="#2E1065;#8B5CF6;#2E1065" dur="4s" begin=".4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="372" cy="70" r="12" fill="#2E1065" stroke="#6D28D9" stroke-width="2">
            <animate attributeName="fill" values="#2E1065;#8B5CF6;#2E1065" dur="4s" begin=".8s" repeatCount="indefinite"/>
          </circle>
          <circle cx="408" cy="70" r="12" fill="#2E1065" stroke="#6D28D9" stroke-width="2">
            <animate attributeName="fill" values="#2E1065;#A78BFA;#2E1065" dur="4s" begin="1.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="408" cy="70" r="12" fill="#E9D5FF" stroke="#E9D5FF" stroke-width="2" transform="translate(-144,0)">
            <animate attributeName="opacity" values="0;1;1" keyTimes="0;.35;1" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;1;0" begin="3.9s" dur="4s" repeatCount="indefinite"/>
          </circle>
        </g>
        <!-- rolling number -->
        <text x="170" y="76" font-size="15" fill="#E9D5FF">
          <animate attributeName="textContent" values="4;4;4;4;5" dur="4s" calcMode="discrete" repeatCount="indefinite"/>
        </text>
        <!-- sweep bar -->
        <rect x="64" y="104" width="352" height="8" rx="4" fill="#17121F"/>
        <rect x="64" y="104" width="352" height="8" rx="4" fill="#8B5CF6" opacity=".85">
          <animate attributeName="width" values="0;352;352;0" keyTimes="0;.45;.95;1" dur="4s" repeatCount="indefinite"/>
        </rect>
        <text x="64" y="132" font-size="11" fill="#6D28D9">// converge · report · repeat</text>
      </svg>