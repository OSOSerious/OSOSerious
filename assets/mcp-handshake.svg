@keyframes blink { 0%,92%{opacity:1} 94%,100%{opacity:0} }
@keyframes typeline { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
@keyframes swim { 0%{transform:translateX(-14%) rotate(-3deg)} 50%{transform:translateX(14%) rotate(3deg)} 100%{transform:translateX(-14%) rotate(-3deg)} }
@keyframes tailflick { 0%,100%{transform:skewX(0)} 50%{transform:skewX(14deg)} }</style>
