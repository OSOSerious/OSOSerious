<svg width="430" height="150" viewBox="0 0 430 150"><style>@keyframes vectorProj { 0%{transform:translate(0,0)} 45%{transform:translate(0,0)} 55%{transform:translate(-26px,10px)} 95%{transform:translate(-26px,10px)} 100%{transform:translate(0,0)} }
@keyframes fadeOutX { 0%,40%{opacity:1} 55%,95%{opacity:.06} 100%{opacity:1} }
@keyframes countTick { 0%{opacity:.3} 8%{opacity:1} 90%{opacity:1} 100%{opacity:.3} }
@keyframes edgeDash { to { stroke-dashoffset:-40; } }
@keyframes ringOut { 0%{transform:scale(.4);opacity:.9} 100%{transform:scale(2.6);opacity:0} }
@keyframes shiver { 0%,100%{transform:translate(0,0)} 25%{transform:translate(.6px,-.6px)} 75%{transform:translate(-.6px,.6px)} }
