<svg width="560" height="240" viewBox="0 0 560 240" class="mono"><style>@keyframes palflip { 0%,42%{transform:rotate(0)} 50%,92%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }
@keyframes glowpulse { 0%,100%{filter:drop-shadow(0 0 4px #6D28D9)} 50%{filter:drop-shadow(0 0 18px #8B5CF6)} }
@keyframes blink { 0%,92%{opacity:1} 94%,100%{opacity:0} }
@keyframes typeline { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
@keyframes sweepX { from{transform:translateX(-120%)} to{transform:translateX(320%)} }
@keyframes dr { 0%{stroke-dashoffset:1400} 45%,80%{stroke-dashoffset:0} 100%{stroke-dashoffset:-1400} }
@keyframes stamp { 0%,55%{opacity:0} 65%,85%{opacity:1} 100%{opacity:0} }</style>
        <!-- input mess -->
        <g stroke="#6D28D9" stroke-width="3" fill="none" opacity=".9">
          <path d="M20 60 q30 40 10 70 q-20 30 30 30 q40 0 30 -40">
            <animate attributeName="opacity" values=".9;.4;.9" dur="3s" repeatCount="indefinite"/>
          </path>
          <path d="M24 100 q40 -20 60 10 q20 30 50 10">
            <animate attributeName="opacity" values=".5;.9;.5" dur="3s" repeatCount="indefinite"/>
          </path>
        </g>
        <text x="20" y="42" font-size="11" fill="#9D8AB8">duct-taped SaaS</text>
        <!-- conveyor -->
        <rect x="120" y="150" width="420" height="12" rx="6" fill="#2E1065"/>
        <g fill="#4C1D95">
          <circle cx="150" cy="156" r="10" fill="#17121F" stroke="#6D28D9" stroke-width="3">
            <animateTransform attributeName="transform" type="rotate" values="0 150 156;360 150 156" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="300" cy="156" r="10" fill="#17121F" stroke="#6D28D9" stroke-width="3">
            <animateTransform attributeName="transform" type="rotate" values="0 300 156;360 300 156" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="450" cy="156" r="10" fill="#17121F" stroke="#6D28D9" stroke-width="3">
            <animateTransform attributeName="transform" type="rotate" values="0 450 156;360 450 156" dur="2s" repeatCount="indefinite"/>
          </circle>
        </g>
        <!-- press -->
        <g transform="translate(240,20)">
          <rect x="0" y="0" width="120" height="44" rx="6" fill="#17121F" stroke="#8B5CF6" stroke-width="2"/>
          <text x="60" y="27" text-anchor="middle" font-size="13" fill="#E9D5FF">OWN-IFIER</text>
          <rect x="52" y="44" width="16" height="30" fill="#4C1D95"/>
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0;0 52;0 0" keyTimes="0;.5;.9" dur="3s" repeatCount="indefinite"/>
            <rect x="24" y="74" width="72" height="22" rx="4" fill="#6D28D9" stroke="#C4B5FD"/>
            <line x1="36" y1="85" x2="84" y2="85" stroke="#E9D5FF" stroke-width="3"/>
          </g>
        </g>
        <!-- mess on belt -->
        <g>
          <rect x="130" y="126" width="46" height="22" rx="5" fill="#3B1580" stroke="#6D28D9"/>
          <path d="M136 137 q8 -8 16 0 q8 8 16 0" stroke="#A78BFA" fill="none" stroke-width="2"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;110 0" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0" keyTimes="0;.8;.95" dur="3s" repeatCount="indefinite"/>
        </g>
        <!-- outputs -->
        <g font-size="9" fill="#17121F" font-weight="700">
          <g>
            <rect x="390" y="118" width="64" height="26" rx="5" fill="#A78BFA" stroke="#E9D5FF" stroke-width="2"/>
            <text x="422" y="135" text-anchor="middle">owned: mcp</text>
            <animate attributeName="opacity" values="0;1" keyTimes="0;.55" dur="3s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="translate" values="0 0;70 0" dur="3s" repeatCount="indefinite"/>
          </g>
        </g>
        <!-- output stack with checks -->
        <g transform="translate(470,60)">
          <g font-size="10">
            <rect x="0" y="0" width="72" height="24" rx="5" fill="#4C1D95" stroke="#A78BFA"/>
            <text x="10" y="16" fill="#E9D5FF">db ✓</text>
            <rect x="0" y="30" width="72" height="24" rx="5" fill="#5B21B6" stroke="#A78BFA"/>
            <text x="10" y="46" fill="#E9D5FF">auth ✓</text>
            <rect x="0" y="60" width="72" height="24" rx="5" fill="#6D28D9" stroke="#C4B5FD"/>
            <text x="10" y="76" fill="#E9D5FF">agents ✓</text>
            <rect x="0" y="90" width="72" height="24" rx="5" fill="#8B5CF6" stroke="#E9D5FF"/>
            <text x="10" y="106" fill="#17121F">audit ✓</text>
          </g>
          <text x="0" y="140" font-size="11" fill="#A78BFA">stack you OWN</text>
        </g>
        <text x="130" y="204" font-size="11" fill="#6D28D9">rent ▸ ▸ ▸</text>
        <text x="330" y="204" font-size="11" fill="#E9D5FF">▸ own ✓</text>
      </svg>