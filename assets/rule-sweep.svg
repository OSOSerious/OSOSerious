<svg xmlns="http://www.w3.org/2000/svg" width="880" height="18" viewBox="0 0 880 18" role="img" aria-label="divider">
  <style>svg{filter:saturate(1.7) brightness(1.3);}</style>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E1065" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#2E1065" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9D5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#E9D5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="8" width="880" height="2" rx="1" fill="url(#rail)"/>
  <rect x="-80" y="7.5" width="90" height="3" rx="1.5" fill="url(#spark)">
    <animate attributeName="x" values="-90;900" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="440" cy="9" r="3" fill="#A78BFA">
    <animate attributeName="opacity" values=".4;1;.4" dur="3.4s" repeatCount="indefinite"/>
  </circle>
</svg>
