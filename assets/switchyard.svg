<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="automation switchyard — a job changing tracks at the junction">
<style>svg{filter:saturate(1.7) brightness(1.3) contrast(1.1);}</style>
<rect width="900" height="420" rx="14" fill="#17121F"/>
<text x="24" y="34" font-size="14" font-family="Courier New,monospace" fill="#A78BFA">// the switchyard</text>
<text x="876" y="34" text-anchor="end" font-size="12" font-family="Courier New,monospace" fill="#6D28D9">jobs change tracks, never lose the ticket</text>
<path d="M 80 210 L 360 210 Q 470 210 540 114 L 820 114" fill="none" stroke="#0B0716" stroke-width="14" stroke-linecap="round"/><path d="M 80 210 L 360 210 Q 470 210 540 114 L 820 114" fill="none" stroke="#3B1580" stroke-width="4" stroke-linecap="round"/><path d="M 80 210 L 360 210 Q 470 210 540 114 L 820 114" fill="none" stroke="#C4B5FD" stroke-width="2.5" stroke-dasharray="14 12" opacity=".85"/>
<path d="M 80 210 L 360 210 Q 470 210 540 306 L 820 306" fill="none" stroke="#0B0716" stroke-width="14" stroke-linecap="round"/><path d="M 80 210 L 360 210 Q 470 210 540 306 L 820 306" fill="none" stroke="#3B1580" stroke-width="4" stroke-linecap="round"/><path d="M 80 210 L 360 210 Q 470 210 540 306 L 820 306" fill="none" stroke="#C4B5FD" stroke-width="2.5" stroke-dasharray="14 12" opacity=".85"/>
<path d="M 80 210 L 820 210" fill="none" stroke="#0B0716" stroke-width="14" stroke-linecap="round"/><path d="M 80 210 L 820 210" fill="none" stroke="#4C1D95" stroke-width="4" stroke-linecap="round"/><path d="M 80 210 L 820 210" fill="none" stroke="#C4B5FD" stroke-width="2.5" stroke-dasharray="14 12" opacity=".85"/>
<!-- junction diamond -->
<g transform="translate(430,210)">
  <rect x="-14" y="-14" width="28" height="28" transform="rotate(45)" fill="#6D28D9" stroke="#E9D5FF" stroke-opacity=".6"/>
  <circle r="6" fill="#E9D5FF"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
</g>
<!-- point signals -->
<g font-family="Courier New,monospace" font-size="10">
  <text x="560" y="94" fill="#A78BFA">branch A ▸ retry</text>
  <text x="560" y="338" fill="#A78BFA">branch B ▸ schedule</text>
  <text x="80" y="186" fill="#6D28D9">cron off · dispatch on</text>
</g>
<!-- sleeper ties (decorative) -->
<g stroke="#241A38" stroke-width="6">
  <line x1="120" y1="218" x2="120" y2="230"/><line x1="220" y1="218" x2="220" y2="230"/>
  <line x1="640" y1="218" x2="640" y2="230"/><line x1="740" y1="218" x2="740" y2="230"/>
</g>
<g><g>
  <path d="M -26 -16 L 26 -16 L 38 -26 L -14 -26 Z" fill="#A78BFA"/>
  <path d="M 26 -16 L 38 -26 L 38 8 L 26 18 Z" fill="#2E1065"/>
  <rect x="-26" y="-16" width="52" height="34" rx="4" fill="#8B5CF6" stroke="#E9D5FF" stroke-opacity=".5"/>
  <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="700" font-family="Courier New,monospace" fill="#17121F">JOB</text>
</g><animateMotion dur="12.0s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1;0;0;1;1" keyTimes="0;.26;.34;.52;.6;.86;1" calcMode="linear" path="M 80 210 L 360 210 Q 470 210 540 114 L 820 114"/></g>
<g><g>
  <path d="M -26 -16 L 26 -16 L 38 -26 L -14 -26 Z" fill="#A78BFA"/>
  <path d="M 26 -16 L 38 -26 L 38 8 L 26 18 Z" fill="#2E1065"/>
  <rect x="-26" y="-16" width="52" height="34" rx="4" fill="#8B5CF6" stroke="#E9D5FF" stroke-opacity=".5"/>
  <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="700" font-family="Courier New,monospace" fill="#17121F">JOB</text>
</g><animateMotion dur="12.0s" begin="-6.0s" repeatCount="indefinite" keyPoints="0;1;1;0;0;1;1" keyTimes="0;.26;.34;.52;.6;.86;1" calcMode="linear" path="M 80 210 L 360 210 Q 470 210 540 306 L 820 306"/></g>
<text x="24" y="400" font-size="11" font-family="Courier New,monospace" fill="#9D8AB8">temporal · airflow · n8n · playwright — every job has a route and a return</text>
