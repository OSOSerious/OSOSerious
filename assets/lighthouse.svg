<svg width="520" height="250" viewBox="0 0 520 250" class="mono"><style>@keyframes palflip { 0%,42%{transform:rotate(0)} 50%,92%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }
@keyframes glowpulse { 0%,100%{filter:drop-shadow(0 0 4px #6D28D9)} 50%{filter:drop-shadow(0 0 18px #8B5CF6)} }
@keyframes blink { 0%,92%{opacity:1} 94%,100%{opacity:0} }
@keyframes typeline { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
@keyframes holoFlick { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.4} 94%{opacity:1} 96%{opacity:.7} 97%{opacity:1} }
@keyframes holoShift { 0%,100%{transform:translateX(0)} 49%{transform:translateX(0)} 50%{transform:translateX(-2px)} 51%{transform:translateX(1px)} }
@keyframes ripple { 0%{transform:scale(.6);opacity:.9} 100%{transform:scale(2.6);opacity:0} }
@keyframes sweepX { from{transform:translateX(-120%)} to{transform:translateX(320%)} }</style>
        <!-- sky gradient -->
        <rect x="0" y="0" width="520" height="180" fill="#17121F"/>
        <!-- stars -->
        <g fill="#E9D5FF"><circle cx="80" cy="30" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
          <circle cx="300" cy="24" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
          <circle cx="450" cy="46" r="1.4"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></circle></g>
        <!-- sea -->
        <rect x="0" y="180" width="520" height="70" fill="#0B0716"/>
        <path d="M0 184 Q60 178 120 184 T240 184 T360 184 T480 184 T600 184" fill="none" stroke="#2E1065" stroke-width="3">
          <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="7s" repeatCount="indefinite"/>
        </path>
        <!-- cliff + lighthouse -->
        <polygon points="60,250 60,150 130,140 150,250" fill="#241A38" stroke="#4C1D95"/>
        <g transform="translate(84,64)">
          <rect x="6" y="40" width="34" height="56" rx="3" fill="#17121F" stroke="#A78BFA" stroke-width="2"/>
          <rect x="6" y="52" width="34" height="8" fill="#8B5CF6" opacity=".8"/>
          <rect x="6" y="72" width="34" height="8" fill="#8B5CF6" opacity=".8"/>
          <rect x="10" y="24" width="26" height="18" rx="4" fill="#4C1D95" stroke="#C4B5FD"/>
          <circle cx="23" cy="33" r="6" fill="#E9D5FF">
            <animate attributeName="opacity" values="1;.4;1" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <polygon points="12,24 34,24 30,14 16,14" fill="#2E1065" stroke="#6D28D9"/>
          <!-- rotating beam -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 23 33;360 23 33" dur="8s" repeatCount="indefinite"/>
            <polygon points="23,33 300,-30 300,100" fill="#E9D5FF" opacity=".12"/>
            <polygon points="23,33 300,-6 300,54" fill="#E9D5FF" opacity=".16"/>
          </g>
        </g>
        <!-- ships/services -->
        <g font-size="9" text-anchor="middle">
          <g transform="translate(300,196)">
            <path d="M-16 0 L16 0 L11 9 L-11 9 Z" fill="#17121F" stroke="#4C1D95"/>
            <rect x="-3" y="-14" width="6" height="14" fill="#6D28D9"/>
            <circle cx="16" cy="-16" r="4" fill="#8B5CF6"><animate attributeName="fill" values="#8B5CF6;#C4B5FD;#8B5CF6" dur="8s" repeatCount="indefinite"/></circle>
            <text y="22" fill="#9D8AB8">api</text>
          </g>
          <g transform="translate(390,216)">
            <path d="M-16 0 L16 0 L11 9 L-11 9 Z" fill="#17121F" stroke="#4C1D95"/>
            <rect x="-3" y="-12" width="6" height="12" fill="#6D28D9"/>
            <circle cx="16" cy="-14" r="4" fill="#8B5CF6"><animate attributeName="fill" values="#C4B5FD;#8B5CF6;#8B5CF6" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
            <text y="22" fill="#9D8AB8">workers</text>
          </g>
          <g transform="translate(470,192)">
            <path d="M-16 0 L16 0 L11 9 L-11 9 Z" fill="#17121F" stroke="#4C1D95"/>
            <rect x="-3" y="-14" width="6" height="14" fill="#6D28D9"/>
            <circle cx="16" cy="-16" r="4" fill="#8B5CF6"><animate attributeName="fill" values="#8B5CF6;#8B5CF6;#C4B5FD;#8B5CF6" dur="8s" begin="5s" repeatCount="indefinite"/></circle>
            <text y="22" fill="#9D8AB8">db</text>
          </g>
        </g>
        <!-- fog -->
        <ellipse cx="240" cy="196" rx="160" ry="18" fill="#9D8AB8" opacity=".08">
          <animate attributeName="cx" values="200;320;200" dur="14s" repeatCount="indefinite"/>
        </ellipse>
        <text x="190" y="40" font-size="11" fill="#A78BFA">// fleet watch</text>
        <text x="190" y="58" font-size="11" fill="#6D28D9">uptime 99.97</text>
      </svg>