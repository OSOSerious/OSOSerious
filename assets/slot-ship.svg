<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" class="mono"><style>svg{filter:saturate(1.7) brightness(1.3) contrast(1.1);}@keyframes palflip { 0%,42%{transform:rotate(0)} 50%,92%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }
@keyframes glowpulse { 0%,100%{filter:drop-shadow(0 0 4px #6D28D9)} 50%{filter:drop-shadow(0 0 18px #8B5CF6)} }
@keyframes blink { 0%,92%{opacity:1} 94%,100%{opacity:0} }
@keyframes typeline { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
@keyframes sweepX { from{transform:translateX(-120%)} to{transform:translateX(320%)} }
@keyframes dr { 0%{stroke-dashoffset:1400} 45%,80%{stroke-dashoffset:0} 100%{stroke-dashoffset:-1400} }
@keyframes stamp { 0%,55%{opacity:0} 65%,85%{opacity:1} 100%{opacity:0} }</style>
        <!-- machine -->
        <rect x="60" y="20" width="400" height="190" rx="16" fill="#0B0716" stroke="#8B5CF6" stroke-width="3"/>
        <rect x="84" y="44" width="352" height="86" rx="10" fill="#17121F" stroke="#4C1D95" stroke-width="2"/>
        <!-- reels -->
        <g font-size="52" font-weight="900" fill="#E9D5FF">
          <g>
            <clipPath id="r1"><rect x="96" y="52" width="90" height="70" rx="6"/></clipPath>
            <g clip-path="url(#r1)">
              <text x="126" y="106" text-anchor="middle">
                <animate attributeName="opacity" values="1;1;0;0;0;1;1;1" keyTimes="0;.28;.3;.36;.42;.44;.9;1" dur="5s" repeatCount="indefinite"/>
                S</text>
              <g>
                <animateTransform attributeName="transform" type="translate" values="126 106;126 -60;126 106" keyTimes="0;.42;.44" dur="5s" repeatCount="indefinite"/>
                <text x="0" y="0" text-anchor="middle" fill="#6D28D9">◎</text>
                <animate attributeName="opacity" values="1;1;0" keyTimes="0;.4;.42" dur="5s" repeatCount="indefinite"/>
              </g>
            </g>
            <rect x="96" y="52" width="90" height="70" rx="6" fill="none" stroke="#4C1D95" stroke-width="2"/>
          </g>
          <g>
            <clipPath id="r2"><rect x="216" y="52" width="90" height="70" rx="6"/></clipPath>
            <g clip-path="url(#r2)">
              <text x="246" y="106" text-anchor="middle">
                <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.48;.5;.56;.58;1" dur="5s" repeatCount="indefinite"/>
                H</text>
              <g>
                <animateTransform attributeName="transform" type="translate" values="246 106;246 -60;246 106" keyTimes="0;.56;.58" dur="5s" repeatCount="indefinite"/>
                <text x="0" y="0" text-anchor="middle" fill="#6D28D9">◎</text>
                <animate attributeName="opacity" values="1;1;0" keyTimes="0;.54;.56" dur="5s" repeatCount="indefinite"/>
              </g>
            </g>
            <rect x="216" y="52" width="90" height="70" rx="6" fill="none" stroke="#4C1D95" stroke-width="2"/>
          </g>
          <g>
            <clipPath id="r3"><rect x="336" y="52" width="90" height="70" rx="6"/></clipPath>
            <g clip-path="url(#r3)">
              <text x="366" y="106" text-anchor="middle">
                <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.68;.7;.76;.78;1" dur="5s" repeatCount="indefinite"/>
                SHIP</text>
              <g>
                <animateTransform attributeName="transform" type="translate" values="366 106;366 -60;366 106" keyTimes="0;.76;.78" dur="5s" repeatCount="indefinite"/>
                <text x="0" y="0" text-anchor="middle" fill="#6D28D9">◎</text>
                <animate attributeName="opacity" values="1;1;0" keyTimes="0;.74;.76" dur="5s" repeatCount="indefinite"/>
              </g>
            </g>
            <rect x="336" y="52" width="90" height="70" rx="6" fill="none" stroke="#4C1D95" stroke-width="2"/>
          </g>
        </g>
        <!-- bell + counter -->
        <g>
          <path d="M240 160 a30 30 0 0 1 60 0 z" fill="#4C1D95" stroke="#A78BFA"/>
          <rect x="236" y="186" width="68" height="8" rx="4" fill="#A78BFA"/>
          <circle cx="270" cy="150" r="7" fill="#E9D5FF">
            <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.78;.82;.96;1" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="r" values="7;12;7" dur=".4s" begin="3.9s" repeatCount="indefinite"/>
          </circle>
        </g>
        <!-- counter -->
        <g transform="translate(84,156)">
          <rect width="120" height="46" rx="7" fill="#17121F" stroke="#4C1D95"/>
          <text x="12" y="20" font-size="11" fill="#9D8AB8">tests</text>
          <text x="12" y="38" font-size="16" fill="#8B5CF6" font-weight="700">3,252</text>
          <text x="78" y="38" font-size="13" fill="#E9D5FF">✓ 0f</text>
        </g>
        <g transform="translate(316,156)">
          <rect width="120" height="46" rx="7" fill="#17121F" stroke="#4C1D95"/>
          <text x="12" y="20" font-size="11" fill="#9D8AB8">commits</text>
          <text x="12" y="38" font-size="16" fill="#A78BFA" font-weight="700">
            <animate attributeName="textContent" values="240;241;242" dur="5s" calcMode="discrete" repeatCount="indefinite"/>
          </text>
        </g>
        <!-- lever -->
        <line x1="472" y1="60" x2="472" y2="130" stroke="#9D8AB8" stroke-width="6">
          <animateTransform attributeName="transform" type="rotate" values="0 472 130;28 472 130;0 472 130" keyTimes="0;.1;.3" dur="5s" repeatCount="indefinite"/>
        </line>
        <circle cx="472" cy="56" r="14" fill="#E9D5FF" stroke="#17121F" stroke-width="2"/>
      </svg>