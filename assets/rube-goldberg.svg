<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" class="mono"><style></style>
        <!-- frame rails -->
        <line x1="20" y1="270" x2="640" y2="270" stroke="#4C1D95" stroke-width="3"/>
        <!-- 1: ball drops from hopper -->
        <g>
          <polygon points="60,30 110,30 98,60 72,60" fill="#4C1D95" stroke="#A78BFA"/>
          <circle r="9" fill="#E9D5FF" stroke="#8B5CF6" stroke-width="2">
            <animate attributeName="cx" values="85;85;150;150" keyTimes="0;.18;.3;1" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="64;64;120;252" keyTimes="0;.18;.3;1" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;.9;.95;1" dur="7s" repeatCount="indefinite"/>
          </circle>
        </g>
        <!-- 2: seesaw at 150,150 -->
        <g transform="translate(150,160)">
          <polygon points="0,16 -14,30 14,30" fill="#2E1065" stroke="#6D28D9"/>
          <line x1="-56" y1="8" x2="56" y2="8" stroke="#A78BFA" stroke-width="7" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="0 0 8;24 0 8;24 0 8;0 0 8" keyTimes="0;.32;.85;1" dur="7s" repeatCount="indefinite"/>
          </line>
          <!-- launched weight -->
          <circle cx="-52" cy="0" r="10" fill="#6D28D9">
            <animate attributeName="cy" values="0;-36;60;60" keyTimes="0;.32;.5;.6" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="cx" values="-52;-52;-20;-20" keyTimes="0;.32;.5;.6" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;.55;.6;.65" dur="7s" repeatCount="indefinite"/>
          </circle>
          <text x="-8" y="46" font-size="10" fill="#6D28D9">lever</text>
        </g>
        <!-- 3: hammer at 230,190 swings when weight lands -->
        <g transform="translate(240,140)">
          <rect x="-4" y="0" width="8" height="60" fill="#4C1D95"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 0 0;-70 0 0;-70 0 0;0 0 0" keyTimes="0;.42;.75;.9" dur="7s" repeatCount="indefinite"/>
            <rect x="-6" y="-44" width="52" height="20" rx="4" fill="#8B5CF6" stroke="#E9D5FF"/>
            <line x1="0" y1="-34" x2="-4" y2="8" stroke="#A78BFA" stroke-width="7"/>
          </g>
          <text x="14" y="78" font-size="10" fill="#6D28D9">hammer</text>
        </g>
        <!-- 4: dominoes at 320-430 -->
        <g font-size="8">
          <rect x="330" y="216" width="18" height="54" rx="3" fill="#4C1D95" stroke="#A78BFA" transform-origin="339 270">
            <animateTransform attributeName="transform" type="rotate" values="0 339 270;66 339 270;66 339 270;0 339 270" keyTimes="0;.48;.86;1" dur="7s" repeatCount="indefinite"/></rect>
          <rect x="366" y="216" width="18" height="54" rx="3" fill="#4C1D95" stroke="#A78BFA" transform-origin="375 270">
            <animateTransform attributeName="transform" type="rotate" values="0 375 270;66 375 270;66 375 270;0 375 270" keyTimes="0;.53;.86;1" dur="7s" repeatCount="indefinite"/></rect>
          <rect x="402" y="216" width="18" height="54" rx="3" fill="#6D28D9" stroke="#C4B5FD" transform-origin="411 270">
            <animateTransform attributeName="transform" type="rotate" values="0 411 270;66 411 270;66 411 270;0 411 270" keyTimes="0;.58;.86;1" dur="7s" repeatCount="indefinite"/></rect>
        </g>
        <!-- 5: bell -->
        <g transform="translate(470,196)">
          <path d="M0 44 a26 26 0 0 1 52 0 z" fill="#4C1D95" stroke="#A78BFA" stroke-width="2">
            <animate attributeName="opacity" values="1;1;1;.4;1" keyTimes="0;.66;.7;1" dur="7s" repeatCount="indefinite"/>
          </path>
          <circle cx="26" cy="30" r="6" fill="#E9D5FF">
            <animate attributeName="r" values="6;11;6" keyTimes="0;.7;.76" dur="7s" repeatCount="indefinite"/>
          </circle>
          <text x="26" y="66" font-size="10" text-anchor="middle" fill="#6D28D9">ding</text>
        </g>
        <!-- 6: SHIP flag pops -->
        <g>
          <rect x="540" y="216" width="84" height="50" rx="8" fill="#2E1065" stroke="#E9D5FF" stroke-width="2"/>
          <text x="582" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#E9D5FF">SHIP ✓</text>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.78;.94;1" dur="7s" repeatCount="indefinite"/>
        </g>
        <text x="24" y="26" font-size="12" fill="#A78BFA">// intent ▸ chain ▸ outcome</text>
        <text x="24" y="44" font-size="11" fill="#6D28D9">energy: conserved. comedy: not.</text>
      </svg>