<svg xmlns="http://www.w3.org/2000/svg" width="880" height="401" viewBox="0 0 880 401" role="img"><style>svg{filter:saturate(1.6) brightness(1.25);}</style><rect width="880" height="401" rx="12" fill="#0E0A16"/><rect x="9" y="9" width="862" height="28" rx="7" fill="#4C1D95"/><text x="18" y="29" font-size="13" fill="#F3EDFF" font-weight="700">Framework</text><text x="164.96" y="29" font-size="13" fill="#F3EDFF" font-weight="700">Experience</text><rect x="9" y="41" width="862" height="46" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="61" font-size="13" fill="#E9D5FF" font-weight="700">Phoenix (Elixir)</text><text x="164.96" y="61" font-size="13" fill="#A78BFA">LiveView real-time UI, Channels for WebSockets, Ecto ORM, fault-tolerant architecture —</text><text x="164.96" y="79" font-size="13" fill="#A78BFA">my default for systems that must not fall over</text><line x1="155.96" y1="45" x2="155.96" y2="83" stroke="#2E1065"/><rect x="9" y="91" width="862" height="46" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="111" font-size="13" fill="#E9D5FF" font-weight="700">FastAPI</text><text x="164.96" y="111" font-size="13" fill="#A78BFA">High-performance Python APIs, async/await, OpenAPI docs, Pydantic validation, WebSocket</text><text x="164.96" y="129" font-size="13" fill="#A78BFA">support</text><line x1="155.96" y1="95" x2="155.96" y2="133" stroke="#2E1065"/><rect x="9" y="141" width="862" height="46" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="161" font-size="13" fill="#E9D5FF" font-weight="700">Django</text><text x="164.96" y="161" font-size="13" fill="#A78BFA">Full-stack Python, Django REST Framework, ORM optimization, admin panel, Celery</text><text x="164.96" y="179" font-size="13" fill="#A78BFA">integration</text><line x1="155.96" y1="145" x2="155.96" y2="183" stroke="#2E1065"/><rect x="9" y="191" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="211" font-size="13" fill="#E9D5FF" font-weight="700">Flask</text><text x="164.96" y="211" font-size="13" fill="#A78BFA">Lightweight REST APIs, Blueprint modularization, Flask-SQLAlchemy</text><line x1="155.96" y1="195" x2="155.96" y2="215" stroke="#2E1065"/><rect x="9" y="223" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="243" font-size="13" fill="#E9D5FF" font-weight="700">Express.js</text><text x="164.96" y="243" font-size="13" fill="#A78BFA">Node.js API framework, middleware patterns, Passport authentication</text><line x1="155.96" y1="227" x2="155.96" y2="247" stroke="#2E1065"/><rect x="9" y="255" width="862" height="46" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="275" font-size="13" fill="#E9D5FF" font-weight="700">Next.js</text><text x="164.96" y="275" font-size="13" fill="#A78BFA">Full-stack React, API routes, SSR/SSG/ISR, App Router, Server Components, Vercel</text><text x="164.96" y="293" font-size="13" fill="#A78BFA">deployment</text><line x1="155.96" y1="259" x2="155.96" y2="297" stroke="#2E1065"/><rect x="9" y="305" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="325" font-size="13" fill="#E9D5FF" font-weight="700">NestJS</text><text x="164.96" y="325" font-size="13" fill="#A78BFA">Enterprise Node.js, TypeScript-first, modular architecture, dependency injection, GraphQL</text><line x1="155.96" y1="309" x2="155.96" y2="329" stroke="#2E1065"/><rect x="9" y="337" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="357" font-size="13" fill="#E9D5FF" font-weight="700">SvelteKit</text><text x="164.96" y="357" font-size="13" fill="#A78BFA">Full-stack Svelte apps, server routes, form actions, adapter-based deployment</text><line x1="155.96" y1="341" x2="155.96" y2="361" stroke="#2E1065"/><rect x="9" y="369" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="389" font-size="13" fill="#E9D5FF" font-weight="700">gRPC</text><text x="164.96" y="389" font-size="13" fill="#A78BFA">Protocol Buffers,