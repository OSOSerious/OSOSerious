<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="aurora"><style>svg{filter:saturate(1.7) brightness(1.3) contrast(1.1);}</style>
  <rect width="900" height="140" fill="#17121F"/>
  <!-- stars -->
  <g fill="#E9D5FF">
    <circle cx="90" cy="24" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="44" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="20" r="1.5"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="52" r="1.3"><animate attributeName="opacity" values="1;.15;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="30" r="1.5"><animate attributeName="opacity" values=".25;.9;.25" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <!-- aurora ribbons: 4 morphing layers -->
  <path fill="none" stroke="#4C1D95" stroke-width="20" stroke-linecap="round" opacity=".8"
    d="M-20 84 Q 200 44 450 78 T 920 70">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M-20 84 Q 200 44 450 78 T 920 70;
              M-20 66 Q 200 104 450 52 T 920 96;
              M-20 92 Q 200 62 450 98 T 920 56;
              M-20 84 Q 200 44 450 78 T 920 70"/>
    <animate attributeName="opacity" values=".5;.85;.5" dur="6s" repeatCount="indefinite"/>
  </path>
  <path fill="none" stroke="#6D28D9" stroke-width="13" stroke-linecap="round" opacity=".75"
    d="M-20 108 Q 240 74 500 104 T 920 96">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M-20 108 Q 240 74 500 104 T 920 96;
              M-20 98 Q 240 130 500 82 T 920 122;
              M-20 118 Q 240 88 500 120 T 920 80;
              M-20 108 Q 240 74 500 104 T 920 96"/>
  </path>
  <path fill="none" stroke="#8B5CF6" stroke-width="8" stroke-linecap="round" opacity=".85"
    d="M-20 60 Q 220 30 480 58 T 920 46">
    <animate attributeName="d" dur="11s" repeatCount="indefinite"
      values="M-20 60 Q 220 30 480 58 T 920 46;
              M-20 46 Q 220 84 480 38 T 920 74;
              M-20 68 Q 220 44 480 74 T 920 38;
              M-20 60 Q 220 30 480 58 T 920 46"/>
  </path>
  <path fill="none" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" opacity=".9"
    d="M-20 74 Q 250 52 510 74 T 920 64">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M-20 74 Q 250 52 510 74 T 920 64;
              M-20 62 Q 250 92 510 56 T 920 88;
              M-20 82 Q 250 64 510 86 T 920 52;
              M-20 74 Q 250 52 510 74 T 920 64"/>
  </path>
  <!-- mark over aurora -->
  <text x="450" y="94" text-anchor="middle" font-family="Courier New,monospace" font-weight="900" font-size="54" fill="#E9D5FF" letter-spacing="12"
    style="filter:drop-shadow(0 0 16px rgba(139,92,246,.9))">OSO</text>
  <text x="450" y="128" text-anchor="middle" font-family="Courier New,monospace" font-size="13" fill="#9D8AB8" letter-spacing="5">own your systems · don't rent them</text>
</svg>
