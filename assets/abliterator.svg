<svg xmlns="http://www.w3.org/2000/svg" width="660" height="250" viewBox="0 0 660 250" role="img" aria-label="abliterator"><style>svg{filter:saturate(1.7) brightness(1.3) contrast(1.1);}</style>
  <!-- The Abliterator — refusal-subspace surgery from oso-obliterated-models -->
  <g font-family="Courier New,monospace">
    <g transform="translate(70,34)">
      <g><polygon points="0,0 170,-42 250,0 80,42" fill="#2E1065" stroke="#4C1D95"/><text x="8" y="4" font-size="12" fill="#9D8AB8">l1</text></g>
      <g transform="translate(14,34)"><polygon points="0,0 170,-42 250,0 80,42" fill="#3B1580" stroke="#5B21B6"/><text x="8" y="4" font-size="12" fill="#9D8AB8">l2</text></g>
      <g transform="translate(28,68)"><polygon points="0,0 170,-42 250,0 80,42" fill="#4C1D95" stroke="#6D28D9"/><text x="8" y="4" font-size="12" fill="#9D8AB8">l3</text></g>
      <g transform="translate(42,102)"><polygon points="0,0 170,-42 250,0 80,42" fill="#5B21B6" stroke="#7C3AED"/><text x="8" y="4" font-size="12" fill="#9D8AB8">l4</text></g>
      <g transform="translate(56,136)"><polygon points="0,0 170,-42 250,0 80,42" fill="#6D28D9" stroke="#8B5CF6"/><text x="8" y="4" font-size="12" fill="#9D8AB8">l5</text></g>
      <!-- refusal vector being projected out -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 0;-26 10;-26 10;0 0" keyTimes="0;.45;.55;.95;1" dur="6s" repeatCount="indefinite"/>
        <line x1="125" y1="6" x2="205" y2="-14" stroke="#E9D5FF" stroke-width="3"/>
        <polygon points="205,-14 194,-17 197,-8" fill="#E9D5FF"/>
        <text x="212" y="-12" font-size="12" fill="#E9D5FF">D(refusal)</text>
      </g>
      <!-- residual compliance vector -->
      <g>
        <animate attributeName="opacity" values="1;1;.06;.06;1" keyTimes="0;.4;.55;.95;1" dur="6s" repeatCount="indefinite"/>
        <line x1="125" y1="6" x2="168" y2="14" stroke="#8B5CF6" stroke-width="3"/>
        <polygon points="168,14 157,13 160,21" fill="#8B5CF6"/>
      </g>
      <!-- PCA basis plane -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 0;-26 10;-26 10;0 0" keyTimes="0;.45;.55;.95;1" dur="6s" repeatCount="indefinite"/>
        <polygon points="100,0 230,-30 245,6 115,36" fill="#E9D5FF" opacity=".14" stroke="#C4B5FD" stroke-dasharray="5 4"/>
        <text x="150" y="42" font-size="12" fill="#C4B5FD">basis k=5 · s=1.0</text>
      </g>
    </g>
    <!-- HUD -->
    <g transform="translate(430,48)">
      <rect width="210" height="160" rx="10" fill="#17121F" stroke="#4C1D95"/>
      <text x="14" y="28" font-size="13" fill="#A78BFA">// ABLITERATOR v5</text>
      <text x="14" y="56" font-size="13" fill="#9D8AB8">refusal    <tspan fill="#E9D5FF">82%→5%</tspan></text>
      <text x="14" y="80" font-size="13" fill="#9D8AB8">compliance <tspan fill="#8B5CF6">95%</tspan> true</text>
      <text x="14" y="104" font-size="13" fill="#9D8AB8">degenerate <tspan fill="#8B5CF6">0%</tspan>  ppl <tspan fill="#A78BFA">13.18</tspan></text>
      <text x="14" y="128" font-size="13" fill="#9D8AB8">attacks <tspan fill="#E9D5FF">82%→11%</tspan></text>
      <text x="14" y="150" font-size="12" fill="#6D28D9">Qwen2.5-1.5B · n=40</text>
    </g>
    <!-- scan band -->
    <rect x="0" y="0" width="90" height="250" fill="#8B5CF6" opacity=".05">
      <animateTransform attributeName="transform" type="translate" values="-90 0;660 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
