<svg xmlns="http://www.w3.org/2000/svg" width="880" height="397" viewBox="0 0 880 397" role="img"><style>svg{filter:saturate(1.6) brightness(1.25);}</style><rect width="880" height="397" rx="12" fill="#0E0A16"/><rect x="9" y="9" width="862" height="28" rx="7" fill="#4C1D95"/><text x="18" y="29" font-size="13" fill="#F3EDFF" font-weight="700">Database</text><text x="148.84" y="29" font-size="13" fill="#F3EDFF" font-weight="700">Experience</text><rect x="9" y="41" width="862" height="46" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="61" font-size="13" fill="#E9D5FF" font-weight="700">PostgreSQL</text><text x="148.84" y="61" font-size="13" fill="#A78BFA">Primary DB, CTEs, window functions, JSONB, full-text search, pgvector for embeddings,</text><text x="148.84" y="79" font-size="13" fill="#A78BFA">replication</text><line x1="139.84" y1="45" x2="139.84" y2="83" stroke="#2E1065"/><rect x="9" y="91" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="111" font-size="13" fill="#E9D5FF" font-weight="700">Redis</text><text x="148.84" y="111" font-size="13" fill="#A78BFA">In-memory store, caching, pub/sub messaging, streams, session storage, rate limiting</text><line x1="139.84" y1="95" x2="139.84" y2="115" stroke="#2E1065"/><rect x="9" y="123" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="143" font-size="13" fill="#E9D5FF" font-weight="700">MongoDB</text><text x="148.84" y="143" font-size="13" fill="#A78BFA">Document database, aggregation pipelines, Atlas cloud deployment</text><line x1="139.84" y1="127" x2="139.84" y2="147" stroke="#2E1065"/><rect x="9" y="155" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="175" font-size="13" fill="#E9D5FF" font-weight="700">Supabase</text><text x="148.84" y="175" font-size="13" fill="#A78BFA">Postgres + Auth + Storage + Realtime subscriptions, Row Level Security, edge functions</text><line x1="139.84" y1="159" x2="139.84" y2="179" stroke="#2E1065"/><rect x="9" y="187" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="207" font-size="13" fill="#E9D5FF" font-weight="700">Neon</text><text x="148.84" y="207" font-size="13" fill="#A78BFA">Serverless Postgres, branching for development, autoscaling, Vercel integration</text><line x1="139.84" y1="191" x2="139.84" y2="211" stroke="#2E1065"/><rect x="9" y="219" width="862" height="46" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="239" font-size="13" fill="#E9D5FF" font-weight="700">Qdrant</text><text x="148.84" y="239" font-size="13" fill="#A78BFA">Vector database for semantic search, embeddings storage, filtering, hybrid search,</text><text x="148.84" y="257" font-size="13" fill="#A78BFA">production RAG</text><line x1="139.84" y1="223" x2="139.84" y2="261" stroke="#2E1065"/><rect x="9" y="269" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="289" font-size="13" fill="#E9D5FF" font-weight="700">Pinecone</text><text x="148.84" y="289" font-size="13" fill="#A78BFA">Managed vector database, similarity search, metadata filtering, serverless deployment</text><line x1="139.84" y1="273" x2="139.84" y2="293" stroke="#2E1065"/><rect x="9" y="301" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="321" font-size="13" fill="#E9D5FF" font-weight="700">ChromaDB</text><text x="148.84" y="321" font-size="13" fill="#A78BFA">Local vector database, Python-native, rapid prototyping</text><line x1="139.84" y1="305" x2="139.84" y2="325" stroke="#2E1065"/><rect x="9" y="333" width="862" height="28" rx="5" fill="#17121F" stroke="#2E1065"/><text x="18" y="353" font-size="13" fill="#E9D5FF" font-weight="700">FAISS</text><text x="148.84" y="353" font-size="13" fill="#A78BFA">Facebook AI Similarity Search, high-performance vector indexing, billion-scale search</text><line x1="139.84" y1="337" x2="139.84" y2="357" stroke="#2E1065"/><rect x="9" y="365" width="862" height="28" rx="5" fill="#1E1730" stroke="#2E1065"/><text x="18" y="385" font-size="13" fill="#E9D5FF" font-weight="700">Elasticsearch</text><text x="148.84" y="385" font-size="13" fill="#A78BFA">Full-text search, analytics, log aggregation, vector search capabilities</text><line x1="139.84" y1="369" x2="139.84" y2="389" stroke="#2E1065"/></svg>